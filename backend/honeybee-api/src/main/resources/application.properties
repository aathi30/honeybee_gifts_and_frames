# Local Windows defaults. Environment variables override connection and security settings.
spring.application.name=honeybee-api
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/honeybee}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=65MB
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
server.port=${PORT:8080}
# Direct localhost HTTP; future hosting can override SERVER_FORWARD_HEADERS_STRATEGY.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=None
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.bootstrap-admin=${BOOTSTRAP_ADMIN:false}
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=INFO
app.admin-username=${ADMIN_USERNAME:}
app.admin-email=${ADMIN_EMAIL:}
app.admin-password=${ADMIN_PASSWORD:}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}